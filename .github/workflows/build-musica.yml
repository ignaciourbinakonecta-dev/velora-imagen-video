name: Construir imagen Velora Música (ACE-Step v1)
on:
  workflow_dispatch:
  push:
    paths: ["musica/**", ".github/workflows/build-musica.yml"]
concurrency:
  group: build-musica
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h / /mnt
      - name: Docker en el disco grande (/mnt)
        run: |
          sudo systemctl stop docker docker.socket
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /mnt/docker
          sudo systemctl start docker
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir
        run: |
          cd musica
          DOCKER_BUILDKIT=0 docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/velora-musica:acestep-v1 .
      - name: Espacio tras construir
        run: df -h / /mnt && docker images
      - name: Publicar
        run: |
          for i in 1 2 3; do docker push ghcr.io/${{ github.repository_owner }}/velora-musica:acestep-v1 && exit 0; sleep 30; done; exit 1
